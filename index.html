<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sin Deudas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="p-4">

  <div class="container">
    <h1 class="mb-4">Divisor de Gastos</h1>

    <!-- Formulario para agregar personas -->
    <div class="card mb-3">
      <div class="card-header">Agregar Persona</div>
      <div class="card-body">
        <div class="input-group mb-3">
          <input type="text" id="nombre" class="form-control" placeholder="Nombre de la persona" />
          <button id="btnAgregarPersona" class="btn btn-primary">Agregar</button>
        </div>
      </div>
    </div>

    <!-- Lista de personas -->
    <div id="listaPersonas" class="mb-4"></div>

    <!-- Botón para calcular deudas -->
    <button id="btnCalcular" class="btn btn-success">Calcular deudas</button>

    <div id="resultado" class="mt-4"></div>
  </div>

  <script type="module" src="dist/main.js"></script>
</body>
</html>
