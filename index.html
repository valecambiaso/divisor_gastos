<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vaquita</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💸</text></svg>" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" />
</head>
<body>

  <header class="hero text-white text-center">
    <div class="container">
      <div class="hero-icon mb-3"><i class="bi bi-wallet2"></i></div>
      <h1 class="fw-bold mb-1">Vaquita</h1>
      <p class="mb-0 opacity-75">Cargá quién pagó qué y te decimos quién le debe a quién.</p>
    </div>
  </header>

  <main class="container app-container pb-5">

    <!-- Formulario para agregar personas -->
    <section class="card shadow-sm border-0 mb-4">
      <div class="card-body p-4">
        <h2 class="h6 text-uppercase text-body-secondary fw-semibold mb-3">
          <i class="bi bi-person-plus me-1"></i> Agregar persona
        </h2>
        <div class="input-group input-group-lg">
          <input type="text" id="nombre" class="form-control" placeholder="Nombre" />
          <button id="btnAgregarPersona" class="btn btn-primary px-4" aria-label="Agregar persona" title="Agregar persona"><i class="bi bi-plus-lg"></i></button>
        </div>
      </div>
    </section>

    <!-- Lista de personas -->
    <section id="listaPersonas" class="mb-4"></section>

    <!-- Botón para calcular deudas -->
    <div class="d-grid">
      <button id="btnCalcular" class="btn btn-success btn-lg shadow-sm">
        <i class="bi bi-calculator me-2"></i>Calcular deudas
      </button>
    </div>

    <section id="resultado" class="mt-4"></section>
  </main>

  <script type="module" src="dist/main.js"></script>
</body>
</html>
